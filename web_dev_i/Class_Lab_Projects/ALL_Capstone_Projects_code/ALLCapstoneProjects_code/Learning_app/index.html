
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Learning Website</title>
    <!-- Google Fonts for better typography -->
    <link href="https://fonts.googleapis.com/css?family=Inter:400,600,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
 
</head>
<body>
    <!-- NAVIGATION -->
    <nav>
        <div class="container nav-content">
            <div class="logo">Learnify</div>
            <div class="nav-search">
                <input type="text" placeholder="Search courses, topics...">
            </div>
            <div class="nav-actions">
                <button class="login">Login</button>
                <button class="signup">Sign Up</button>
            </div>
        </div>
    </nav>

    <!-- HERO SECTION -->
    <section class="hero">
        <div class="container">
            <h1>Unlock Your Potential with Online Learning</h1>
            <p>Join thousands of learners and access top-rated courses from expert instructors. Learn anytime, anywhere.</p>
            <form class="hero-cta">
                <input type="text" placeholder="What do you want to learn?">
                <button type="submit">Find Courses</button>
            </form>
        </div>
    </section>

</body>
</html></div>
