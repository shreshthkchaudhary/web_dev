<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Corner Boxes</title>
  <style>
    .parent {
      width: 400px;
      height: 400px;
      background-color: #f0f0f0;
      position: relative;           /* positioned ancestor */ 
      margin: 40px auto;
    }

    .child {
      width: 100px;
      height: 100px;
      background-color: #3498db;
      position: absolute;           /* place in corners */    
    }

    #top-left    { top: 0; left: 0; }
    #top-right   { top: 0; right: 0; }
    #bottom-left { bottom: 0; left: 0; }
    #bottom-right{ bottom: 0; right: 0; }
  </style>
</head>
<body>
  <div class="parent">
    <div class="child" id="top-left"></div>
    <div class="child" id="top-right"></div>
    <div class="child" id="bottom-left"></div>
    <div class="child" id="bottom-right"></div>
  </div>
</body>
</html>
