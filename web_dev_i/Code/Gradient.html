<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #a{
            border: 2px solid black;
            height: 200px;
            background: linear-gradient(yellow ,orange, red);
        }
        #b{
            border: 2px solid black;
            height: 200px;
            background: linear-gradient(to top right,yellow ,orange, red);
        }
        #c{
            border: 2px solid black;
            height: 200px;
            background: linear-gradient(to right,yellow ,orange, red);
        }
        #d{
            border: 2px solid black;
            height: 200px;
            background: linear-gradient(to bottom,yellow ,orange, red);
        }
        #e{
            border: 2px solid black;
            height: 200px;
            background: radial-gradient(yellow ,orange, red);
        }
        #f{
            border: 2px solid black;
            height: 200px;
            background: conic-gradient(yellow ,orange, red);
        }
    </style>
</head>
<body>
    <div id="a">123</div>
    <div id="b">123</div>
    <div id="c">123</div>
    <div id="d">123</div>
    <div id="e">123</div>
    <div id="f">123</div>
</body>
</html>
