<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
         #parent{
            border: 2px solid black;
            height: 500px;
            width: 500px;
            display: flex;
            /* gap: 10px; */
            justify-content: center;
            /* justify-content: end; */
            justify-content: space-between;
            align-items: center;
            align-items: end;
        }
        .child{
            border: 2px solid black;
            height: 100px;
            width: 100px;
        }
        
        @media (max-width:500px){
            #parent{
                border: 2px solid rgb(255, 0, 0);
                height: 50px;
                width: 50px;
                display: flex;
                /* gap: 10px; */
                justify-content: center;
                /* justify-content: end; */
                justify-content: space-between;
                align-items: center;
                align-items: end;
            }
            .child{
                border: 2px solid rgb(255, 0, 0);
                height: 10px;
                width: 10px;
            }

        }
       
    </style>
</head>
<body>
    <div id="parent">
        <div class="child" id="child1">1</div>
        <div class="child" id="child2">2</div>
        <div class="child" id="child3">3</div>
        <div class="child" id="child4">4</div>
    </div>
</body>
</html>
