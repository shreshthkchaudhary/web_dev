<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Position</title>
    <style>
        *{
            margin: 0;
        }
        div{
            border: 10px solid black;
            height: 400px;
            width: 400px;
            position: relative;
        }
        .para{
            border: 2px solid black;
            height: 100px;
            width: 100px;
        }
        #para1{
            background-color: blue;
            position: relative;
            left: 125px;
            top: 125px;
            z-index: 1;
        }
        #para2{
            background-color: red;
            position: absolute;
            right: 125px;
            bottom: 125px;
            z-index: 2;
        }
    </style>
</head>
<body>
    <div>
    <p class="para" id="para1">hi</p>
    <p class="para" id="para2">hi</p>
    </div>
</body>
</html>
